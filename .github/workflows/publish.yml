name: Publish Website

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render English Book
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: en

      - name: Render NoteEn
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: NoteEn

      - name: Prepare Public Directory
        run: |
          mkdir -p public

          if [ -f "index.html" ]; then
            cp index.html public/
          fi

          if [ -f "Planar_Geometry_over_C.pdf" ]; then
            cp Planar_Geometry_over_C.pdf public/
          fi
          if [ -f "Geometry_Notes.pdf" ]; then
            cp Geometry_Notes.pdf public/
          fi

          if [ -d "en/_book" ]; then
            mkdir -p public/en
            cp -r en/_book/* public/en/
          else
            echo "Warning: en/_book not found"
            ls -la en
            exit 1
          fi

          if [ -d "NoteEn/_book" ]; then
            mkdir -p public/NoteEn
            cp -r NoteEn/_book/* public/NoteEn/
          else
            echo "Warning: NoteEn/_book not found"
            ls -la NoteEn
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish Website

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render English Book
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: en
          
      - name: Render NoteEn
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: NoteEn

      - name: Prepare Public Directory
        run: |
          mkdir -p public
          
          # 1. 複製根目錄的主頁面
          if [ -f "index.html" ]; then
            cp index.html public/
          fi
          
          # 2. 複製 PDF 檔案到發布根目錄（確保網頁上的 PDF 連結能正常下載）
          if [ -f "Planar_Geometry_over_C.pdf" ]; then
            cp Planar_Geometry_over_C.pdf public/
          fi
          if [ -f "Geometry_Notes.pdf" ]; then
            cp Geometry_Notes.pdf public/
          fi
          
          # 3. 將 en/ 底下編譯好的書本內容放入 public/en/ 子目錄
          mkdir -p public/en
          cp -r en/_book/* public/en/

          # 4. 將 NoteEn/ 底下編譯好的書本內容放入 public/NoteEn/ 子目錄
          mkdir -p public/NoteEn
          cp -r NoteEn/_book/* public/NoteEn/


      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

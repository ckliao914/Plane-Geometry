project:
  type: book

book:
  title: "Complex Planar Geometry"
  chapters:
    - index.qmd
    - ch1.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          output: {
            font: 'mathjax-tex'
          },
          chtml: {
            linebreaks: {
              automatic: false,
              inline: false
            }
          }
        };
        </script>

crossref:
  thm-title: "Theorem"
  lem-title: "Lemma"
  thm-prefix: "Theorem"
  lem-prefix: "Lemma"

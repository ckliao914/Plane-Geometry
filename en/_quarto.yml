project:
  type: book

book:
  title: "Complex Planar Geometry"
  chapters:
    - index.qmd
    - ch1.qmd
  number-sections: true   # 這裡啟用全域章節編號

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          output: {
            font: 'mathjax-tex'
          },
          chtml: {
            linebreaks: {
              automatic: false,
              inline: false
            }
          }
        };
        </script>

crossref:
  chapters: true          # 關鍵：讓編號帶入章節前綴（如 1.1）
  thm-title: "Theorem"
  lem-title: "Lemma"
  cor-title: "Corollary"
  thm-prefix: "Theorem"
  lem-prefix: "Lemma"
  cor-prefix: "Corollary"

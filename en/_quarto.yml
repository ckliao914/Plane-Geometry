project:
  type: book

book:
  title: "Complex Planar Geometry"
  chapters:
    - index.qmd
    - ch1.qmd

# 這裡移到頂層，讓整本書啟用章節編號
number-sections: true

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          output: {
            font: 'mathjax-tex'
          },
          chtml: {
            linebreaks: {
              automatic: false,
              inline: false
            }
          }
        };
        </script>

crossref:
  chapters: true
  thm-title: "Theorem"
  lem-title: "Lemma"
  cor-title: "Corollary"
  thm-prefix: "Theorem"
  lem-prefix: "Lemma"
  cor-prefix: "Corollary"
  
theorem:
  name: true
  theorems:
    - name: theorem
      title: "Theorem"
    - name: lemma
      title: "Lemma"
      as: theorem
    - name: corollary
      title: "Corollary"
      as: theorem
